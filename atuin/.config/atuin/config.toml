# Only the settings that differ from atuin's defaults.
# Nix updates atuin, so its own update check is noise.
update_check = false
# Enter runs the selected command; tab puts it on the command line to edit.
enter_accept = true
style = "compact"
inline_height = 20
# Search everything by default; ctrl-r inside the search cycles to this
# session, directory, host or workspace (git repository).
filter_mode = "global"
workspaces = true

# Self-hosted sync server (~/dev/homelab services/atuin). Syncs once a machine
# has signed in (`atuin login`); history is encrypted before upload.
sync_address = "https://atuin.ians.cloud"
auto_sync = true
sync_frequency = "5m"
