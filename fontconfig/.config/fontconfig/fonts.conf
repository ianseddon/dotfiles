<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- The families chosen with `theme font mono|sans <family>`. Included first
       because, for the same alias, fontconfig puts an earlier preference ahead
       of a later one. Without the file, the defaults below apply. -->
  <include ignore_missing="yes">~/.local/state/theme/fonts.conf</include>

  <!-- Defaults. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Mononoki Nerd Font</family>
      <!-- Icons for any monospace font without a Nerd Font build. -->
      <family>Symbols Nerd Font</family>
    </prefer>
  </alias>
</fontconfig>
