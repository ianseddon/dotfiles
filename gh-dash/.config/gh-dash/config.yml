# gh-dash merges this file over its built-in defaults; only overrides live here.
# Listing prSections replaces the default PR tabs, so all of them are spelled out.
# Every tab except My Pull Requests drops drafts with draft:false.
prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  # Drops out once someone approves it, it merges or closes, or I review it.
  - title: Needs My Review
    filters: is:open draft:false review-requested:@me -review:approved
  - title: Assigned
    filters: is:open draft:false assignee:@me
  # Two weeks without activity means it no longer needs me.
  - title: Involved
    filters: >-
      is:open draft:false involves:@me -author:@me
      updated:>={{ nowModify "-2w" }}
  - title: Recently Merged
    filters: >-
      is:merged author:@me
      merged:>={{ nowModify "-1w" }}
    layout:
      ci:
        hidden: true
  # workforce-monorepo PRs ready to merge: green CI plus either the robot label or an
  # approving review. gh-dash's search API ignores OR/parentheses (dlvhdr/gh-dash#955),
  # so the two paths are separate tabs; the approved tab drops robot-labeled PRs to dedupe.
  - title: Mergeable (robot)
    filters: repo:EBSCO-Nexus/workforce-monorepo is:open draft:false status:success label:robot-says-merge
  - title: Mergeable (approved)
    filters: repo:EBSCO-Nexus/workforce-monorepo is:open draft:false status:success review:approved -label:robot-says-merge

# The GitHub notifications inbox. Opening one marks it read and it drops out.
notificationsSections:
  - title: New Activity
    filters: is:unread reason:author reason:comment reason:mention
  - title: Participating
    filters: reason:participating
  - title: Review Requested
    filters: reason:review-requested
  - title: Mentioned
    filters: reason:mention reason:team-mention
includeReadNotifications: false

defaults:
  view: prs
  refetchIntervalMinutes: 5
  preview:
    open: true
    width: 0.5

pager:
  diff: delta

# `T` reviews in tuicr; lowercase `t` stays gh-dash's smart-filtering toggle,
# which scopes the lists to the repo gh-dash was started in (unbound in v4.26).
# tuicr fetches the PR through `gh`, so it needs no local clone or repoPaths entry; `:submit` inside
# tuicr posts the review back to GitHub. Agent-authored changes use Hunk's
# on-demand Herdr actions rather than the archived custom PR worktree flow.
keybindings:
  # g is firstLine, so lazygit goes on ctrl+g.
  universal:
    - key: ctrl+g
      name: lazygit
      command: cd {{.RepoPath}} && lazygit
  prs:
    - key: T
      name: review in tuicr
      command: tuicr pr https://github.com/{{.RepoName}}/pull/{{.PrNumber}}
    # gh-dash has no reviewer action; `E` is unbound in v4.26.1's keymap.
    - key: E
      name: request reviewers
      command: $HOME/.config/gh-dash/bin/request-reviewers {{.RepoName}} {{.PrNumber}}
    # Checkout as a worktrunk worktree instead of gh-dash's built-in, which runs
    # `gh pr checkout` in the main checkout. Overriding both of its keys.
    - key: C
      name: check out as worktree (worktrunk)
      command: $HOME/.config/gh-dash/bin/checkout-pr {{.RepoPath}} {{.RepoName}} {{.PrNumber}}
    - key: space
      name: check out as worktree (worktrunk)
      command: $HOME/.config/gh-dash/bin/checkout-pr {{.RepoPath}} {{.RepoName}} {{.PrNumber}}

# Where checkouts live (gh-dash's {{.RepoPath}}); worktrees are worktrunk's
# business (worktrunk/.config/worktrunk/config.toml). Exact entries win over the
# template: checkouts made before the ~/dev/github.com layout stay where they are.
repoPaths:
  EBSCO-Nexus/workforce-monorepo: ~/dev/nexus/workforce-monorepo
  ianseddon/dotfiles: ~/dotfiles
  ":owner/:repo": ~/dev/github.com/:owner/:repo

# Kanagawa Wave, mapped from kanagawa.nvim's palette
# (https://github.com/rebelot/kanagawa.nvim, MIT) to match Ghostty, nvim, and tuicr.
theme:
  colors:
    text:
      primary: "#DCD7BA"     # fujiWhite, Normal fg
      secondary: "#C8C093"   # oldWhite
      inverted: "#16161D"    # sumiInk0, text on colored pills
      faint: "#727169"       # fujiGray, Comment
      warning: "#FF9E3B"     # roninYellow, DiagnosticWarn
      success: "#98BB6C"     # springGreen
      error: "#E82424"       # samuraiRed, DiagnosticError
      actor: "#7E9CD8"       # crystalBlue, @user in notifications
    background:
      selected: "#223249"    # waveBlue1, Visual; selected row, active tab, footer
    border:
      primary: "#54546D"     # sumiInk6, tab underline and sidebar
      secondary: "#727169"   # fujiGray, tab separators
      faint: "#2A2A37"       # sumiInk4, row separators and view switcher
    icon:
      newcontributor: "#98BB6C" # springGreen
      contributor: "#7E9CD8"    # crystalBlue
      collaborator: "#E6C384"   # carpYellow
      member: "#E6C384"
      owner: "#E6C384"
      unknownrole: "#727169"    # fujiGray
