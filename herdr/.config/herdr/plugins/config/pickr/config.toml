# Upstream herdr-pickr stock configuration, with Linux's browser opener.
[pickr]
auto = false
default = "tuicr"

[[backend]]
key = "t"
id = "tuicr"
name = "tuicr — full review, comments to the forge"
run = "tuicr pr {url}"
where = "pane"
needs = ["tuicr"]
platforms = ["github", "gitlab"]

[[backend]]
key = "h"
id = "hunk"
name = "hunk — fast diff viewer"
run_github = "gh pr diff {url} --no-color | hunk patch -"
run_gitlab = "glab mr diff {url} | hunk patch -"
where = "pane"
needs = ["gh", "hunk"]
platforms = ["github", "gitlab"]

[[backend]]
key = "d"
id = "diff"
name = "diff — plain read-only (bat)"
run_github = "gh pr diff {url} | bat --paging=always -l diff"
run_gitlab = "glab mr diff {url} | bat --paging=always -l diff"
where = "pager"
needs = ["gh", "bat"]
platforms = ["github", "gitlab"]

[[backend]]
key = "o"
id = "browser"
name = "open in browser"
run = "xdg-open {url}"
where = "detach"
needs = ["xdg-open"]
platforms = ["github", "gitlab"]
