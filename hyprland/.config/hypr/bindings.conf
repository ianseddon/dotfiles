####################
### KEYBINDINGS  ###
####################

# https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# https://wiki.hyprland.org/Configuring/Binds/
bindd = $mainMod, RETURN, Terminal, exec, $terminal
bindd = $mainMod, Q, Close window, killactive,
bindd = $mainMod, M, Exit session, exit,
bindd = $mainMod, SPACE, App launcher, exec, $menu

# Copy / Paste (universal — works in terminals too)
bindd = $mainMod, C, Copy, sendshortcut, CTRL, Insert,
bindd = $mainMod, V, Paste, sendshortcut, SHIFT, Insert,
bindd = $mainMod, X, Cut, sendshortcut, CTRL, X,

# -- Tiling control --
bindd = $mainMod, E, Toggle split, layoutmsg, togglesplit
bindd = $mainMod, P, Pseudo tile, layoutmsg, pseudo
bindd = $mainMod, T, Toggle floating, togglefloating,
bindd = $mainMod, F, Fullscreen, fullscreen, 0
bindd = $mainMod CTRL, F, Tiled fullscreen, fullscreenstate, 0 2
bindd = $mainMod ALT, F, Full width, fullscreen, 1
bindd = $mainMod, O, Pop out window (float + pin), exec, hyprctl dispatch setfloating && hyprctl dispatch pin

# -- Vim focus navigation --
bindd = $mainMod, H, Focus left, movefocus, l
bindd = $mainMod, L, Focus right, movefocus, r
bindd = $mainMod, K, Focus up, movefocus, u
bindd = $mainMod, J, Focus down, movefocus, d

# -- Vim window swap --
bindd = $mainMod SHIFT, H, Swap window left, swapwindow, l
bindd = $mainMod SHIFT, L, Swap window right, swapwindow, r
bindd = $mainMod SHIFT, K, Swap window up, swapwindow, u
bindd = $mainMod SHIFT, J, Swap window down, swapwindow, d

# -- Window resizing --
bindd = $mainMod, code:20, Shrink window width, resizeactive, -100 0    # - key
bindd = $mainMod, code:21, Grow window width, resizeactive, 100 0       # = key
bindd = $mainMod SHIFT, code:20, Shrink window height, resizeactive, 0 -100
bindd = $mainMod SHIFT, code:21, Grow window height, resizeactive, 0 100

# -- Window cycling (ALT+TAB) --
bindd = ALT, TAB, Next window, cyclenext
bindd = ALT SHIFT, TAB, Previous window, cyclenext, prev
bindd = ALT, TAB, Bring active to top, bringactivetotop
bindd = ALT SHIFT, TAB, Bring active to top, bringactivetotop

# -- Window groups --
bindd = $mainMod, G, Toggle group, togglegroup
bindd = $mainMod ALT, G, Move out of group, moveoutofgroup
bindd = $mainMod ALT, H, Join group left, moveintogroup, l
bindd = $mainMod ALT, L, Join group right, moveintogroup, r
bindd = $mainMod ALT, K, Join group up, moveintogroup, u
bindd = $mainMod ALT, J, Join group down, moveintogroup, d
bindd = $mainMod ALT, TAB, Next in group, changegroupactive, f
bindd = $mainMod ALT SHIFT, TAB, Previous in group, changegroupactive, b

# -- Workspaces --
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9
bindd = $mainMod, 0, Workspace 10, workspace, 10

# Move window to workspace
bindd = $mainMod SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move to workspace 10, movetoworkspace, 10

# Cycle workspaces
bindd = $mainMod, TAB, Next workspace, workspace, e+1
bindd = $mainMod SHIFT, TAB, Previous workspace, workspace, e-1
bindd = $mainMod CTRL, TAB, Last workspace, workspace, previous

# Scroll through workspaces
bindd = $mainMod, mouse_down, Scroll workspace forward, workspace, e+1
bindd = $mainMod, mouse_up, Scroll workspace backward, workspace, e-1

# Move workspaces between monitors
bindd = $mainMod SHIFT ALT, H, Move workspace to left monitor, movecurrentworkspacetomonitor, l
bindd = $mainMod SHIFT ALT, L, Move workspace to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod SHIFT ALT, K, Move workspace to upper monitor, movecurrentworkspacetomonitor, u
bindd = $mainMod SHIFT ALT, J, Move workspace to lower monitor, movecurrentworkspacetomonitor, d

# -- Scratchpad --
bindd = $mainMod, S, Toggle scratchpad, togglespecialworkspace, magic
bindd = $mainMod ALT, S, Move to scratchpad, movetoworkspacesilent, special:magic

# -- Mouse move/resize --
bindmd = $mainMod, mouse:272, Move window, movewindow
bindmd = $mainMod, mouse:273, Resize window, resizewindow

# -- Screenshot --
bindd = $mainMod SHIFT, S, Screenshot region, exec, hyprshot --mode region
