# Colours from the current theme ($accent, $surface, ...). `theme set <name>` writes
# this file; see theme/ in the dotfiles.
source = ~/.local/state/theme/current/hyprlock.conf
$Scripts = $HOME/.config/hypr/scripts

general {
    # Enter on an empty field must not reach PAM: an empty submit is a real
    # authentication failure and used to feed faillock lockouts.
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot   # screenshot of your desktop
    #color = $color7

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_size = 5
    blur_passes = 1 # 0 disables blurring
    noise = 0.0117
    contrast = 1.3000 # Vibrant!!!
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $accent
    inner_color = $surface
    font_color = $foreground
    check_color = $check
    fail_color = $fail
    #fade_on_empty = true
    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    
    position = 0, 200
    halign = center
    valign = bottom
}

# Date
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %-d %B %Y')" </b>"
    color = $foreground
    font_size = 34
    font_family = monospace

    position = 0, -150
    halign = center
    valign = top
}
