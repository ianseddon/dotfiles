################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# > hyprctl monitors all

env = GDK_SCALE,1.75

# Match by make/model/serial, not connector: DP-1/DP-2 swap between the screens.
# desc:<description>, resolution[@refresh], position, scale
monitor=desc:LG Electronics LG HDR 4K 0x00052A41,highres,0x0,1.25 # left monitor, horizontal
monitor=desc:Acer Technologies V277U TDCAA002852A,highres,3072x-450,1,transform,3 # right monitor, rotated 270 deg
# Any other display: preferred mode, auto-placed, never rotated
monitor=,preferred,auto,auto
