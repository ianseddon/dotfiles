# Put the Nix profile first for the whole user session, not only fish, so apps
# started by Hyprland, systemd user units, and other shells find the same tools,
# completions, man pages, and desktop entries.
PATH=$HOME/.nix-profile/bin:$PATH
XDG_DATA_DIRS=$HOME/.nix-profile/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}
