# Keep pass-cli's session key in the Secret Service (GNOME Keyring, unlocked at
# login by pam/greetd). The default kernel keyring is cleared on reboot, and
# pass-cli then logs out. Every pass-cli run must see this: one without it
# finds no key and forces a logout. environment.d reaches the systemd user
# units and, through uwsm, the whole Hyprland session.
PROTON_PASS_LINUX_KEYRING=dbus
